name: nassan_app
description: "Alnassan App Islamic App"
publish_to: 'none'

version: 0.0.4+4

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8


  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Navigation

  go_router: ^16.2.0


  # Dependency Injection
  get_it: ^8.2.0
  injectable: ^2.5.1


  # Networking & API
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0


  # UI Components & Styling
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.0
  google_fonts: ^6.3.1
  cached_network_image: ^3.4.1
  flutter_staggered_grid_view: 0.7.0
  staggered_grid_view: ^0.0.1
  skeletonizer: ^2.1.0+1
  dotted_border: ^3.1.0
  flutter_slidable: ^4.0.1
  flutter_speed_dial: ^7.0.0
  dropdown_search: 6.0.2
  flutter_colorpicker: ^1.1.0
  country_picker: 2.0.27


  # Animations & Loading
  lottie: 3.3.1
  flutter_spinkit: ^5.2.2
  loading_animation_widget: 1.3.0
  text_scroll: 0.2.0

  # Media - Audio/Video/Images
  audioplayers: ^6.5.1
  video_player: ^2.8.2
  youtube_player_flutter: ^9.1.2
  image_picker: ^1.2.0
  flutter_image_compress: ^2.0.4
  voice_note_kit: ^1.3.3

  # Storage & File Management
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  path: 1.9.1


  # PDF & Document Viewing
  pdf: 3.11.3
  syncfusion_flutter_pdfviewer: ^31.1.19


  # Localization & Internationalization
  flutter_localization: ^0.3.3
  intl: ^0.20.2


  # Permissions & Platform Features
  permission_handler: ^12.0.1
  device_info_plus: ^11.5.0
  android_intent_plus: ^6.0.0
  google_maps_flutter: ^2.12.3


  # Utilities & Helpers
  collection: ^1.17.2
  uuid: 4.5.1
  logger: ^2.6.1
  talker_flutter: ^5.0.0
  dartz: ^0.10.0
  xml: ^6.6.1
  share_plus: ^11.1.0
  rename: ^3.0.2
  infinite_scroll_pagination: ^5.1.1


  # Code Generation & Build Tools
  flutter_gen: ^5.11.0
  freezed_annotation: ^3.1.0
  json_annotation: 4.9.0
  json_serializable: ^6.1.4
  flutter_launcher_icons: ^0.13.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.7.0
  freezed: ^3.0.0
  flutter_gen_runner: ^5.11.0
  flutter_lints: ^6.0.0

  # HTML Parsing & Rendering (Dev)
  flutter_html: ^3.0.0
  html: ^0.15.0

  # Development Utilities
  marquee: ^2.3.0
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/svg/
    - assets/lottie/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri/Amiri-Bold.ttf
        - asset: assets/fonts/Amiri/Amiri-Bold.ttf
          weight: 700
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal/Tajawal-Bold.ttf
          weight: 700

flutter_gen:
  output: lib/gen/
  line_length: 120
  integrations:
    image: true
    flutter_svg: true


flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"